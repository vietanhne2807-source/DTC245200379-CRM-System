global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "/etc/prometheus/alert_rules.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'crm_web_app'
    static_configs:
      - targets: ['crm_web:5000']

  - job_name: 'nginx_web_server'
    static_configs:
      - targets: ['nginx_exporter:9113']

  - job_name: 'postgresql_database'
    static_configs:
      - targets: ['postgres_exporter:9187']

  - job_name: 'docker_containers'
    static_configs:
      - targets: ['cadvisor:8080']
