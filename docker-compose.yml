services:
  postgres_db:
    image: postgres:15-alpine
    container_name: crm_postgres
    restart: unless-stopped
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crm_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: crm_pgadmin
    restart: unless-stopped
    env_file: .env
    ports:
      - "5050:80"
    depends_on:
      postgres_db:
        condition: service_healthy
    networks:
      - backend_net

  crm_web:
    build: ./app
    container_name: crm_web
    restart: unless-stopped
    environment:
      - DB_HOST=postgres_db
      - DB_NAME=${POSTGRES_DB}
      - DB_USER=${APP_DB_USER}
      - DB_PASSWORD=${APP_DB_PASSWORD}
    depends_on:
      postgres_db:
        condition: service_healthy
    networks:
      - frontend_net
      - backend_net
      - monitor_net

  nginx_proxy:
    image: nginx:1.25-alpine
    container_name: crm_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - crm_web
    networks:
      - frontend_net
      - monitor_net

  nginx_exporter:
    image: nginx/nginx-prometheus-exporter:1.1.0
    container_name: crm_nginx_exporter
    restart: unless-stopped
    command:
      - "-nginx.scrape-uri=http://nginx_proxy:8080/stub_status"
    depends_on:
      - nginx_proxy
    networks:
      - monitor_net

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: crm_postgres_exporter
    restart: unless-stopped
    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres_db:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres_db:
        condition: service_healthy
    networks:
      - backend_net
      - monitor_net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: crm_cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - monitor_net

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: crm_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - crm_web
      - nginx_exporter
      - postgres_exporter
      - cadvisor
    networks:
      - monitor_net

  grafana:
    image: grafana/grafana:10.4.1
    container_name: crm_grafana
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - monitor_net

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
  monitor_net:
    driver: bridge

volumes:
  pgdata:
  grafana_data:
